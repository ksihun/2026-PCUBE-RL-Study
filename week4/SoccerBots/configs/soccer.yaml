behaviors:
  Striker:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant

    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 1000
    summary_freq: 10000

    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0


  Goalie:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant

    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 1000
    summary_freq: 10000

    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0


environment_parameters:
  lesson: 
    curriculum:
      - name: EmptyGoal
        completion_criteria:
          measure: reward
          behavior: Striker
          signal_smoothing: true
          min_lesson_length: 100
          # A striker receives about -1 over a time-limit episode from the
          # negative existential reward.  Requiring +0.4 here meant the
          # empty-goal lesson could only advance after near-perfect scoring.
          threshold: -0.7
        value: 0.0
      - name: VsGoalie
        completion_criteria:
          measure: reward
          behavior: Striker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: -0.6
        value: 1.0
      - name: SelfPlay
        value: 2.0
